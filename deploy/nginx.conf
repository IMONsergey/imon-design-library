# Dedicated virtual host. Does not change any other I’MON project.
server {
    listen 94.249.186.240:80;
    server_name css.imon.world;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/imonmeets-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://css.imon.world$request_uri; }
}

server {
    listen 94.249.186.240:443 ssl;
    server_name css.imon.world;
    ssl_certificate /etc/letsencrypt/live/css-imon-world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/css-imon-world/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/imon-design-library/current;
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    index index.html;
    autoindex off;
    server_tokens off;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    include /etc/nginx/snippets/imon-design-security.conf;
    # Only two reviewed static Radix viewport rules are hash-authorized; see tests/radix-csp.test.mjs.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'sha256-441zG27rExd4/il+NvIqyL8zFx5XmyNQtE381kSkUJk=' 'sha256-vGQdhYJbTuF+M8iCn1IZCHpdkiICocWHDq4qnQF4Rjw='; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;

    location ~ (^|/)\. { return 404; }
    # A fresh nonce is substituted only into the catalog shell, never pack previews.
    # Requires nginx --with-http_sub_module. Keep HTML out of intermediary caches.
    location ~ ^/(?:index\.html)?$ {
        include /etc/nginx/snippets/imon-design-security.conf;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'nonce-$request_id' 'sha256-441zG27rExd4/il+NvIqyL8zFx5XmyNQtE381kSkUJk=' 'sha256-vGQdhYJbTuF+M8iCn1IZCHpdkiICocWHDq4qnQF4Rjw='; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        etag off;
        if_modified_since off;
        sub_filter '__IMON_CSP_NONCE__' '$request_id';
        sub_filter_once on;
        try_files /index.html =404;
    }
    location ~ ^/(app\.css|app\.js|theme-init\.js|third-party-notices\.txt|favicon\.svg|health\.json|robots\.txt)$ { try_files $uri =404; }
    location ~ ^/ui-assets/[A-Za-z0-9_-][A-Za-z0-9_.-]*\.woff2$ {
        types { }
        default_type font/woff2;
        include /etc/nginx/snippets/imon-design-security.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        if ($uri !~ \.json$) { return 404; }
        default_type application/json;
        try_files $uri =404;
    }

    # Raw files are inert code, never a second executable route.
    location /raw/ {
        types { }
        default_type text/plain;
        include /etc/nginx/snippets/imon-design-security.conf;
        add_header Content-Disposition "attachment" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Defense in depth: direct preview URLs stay sandboxed, too.
    location /previews/ {
        include /etc/nginx/snippets/imon-design-security.conf;
        add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /downloads/ {
        if ($uri !~ \.zip$) { return 404; }
        types { }
        default_type application/zip;
        include /etc/nginx/snippets/imon-design-security.conf;
        add_header Content-Disposition "attachment" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / { return 404; }
}
