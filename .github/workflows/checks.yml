name: Validate library
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: library-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install trusted catalog dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --include=dev --include=optional --no-audit --fund=false
      - name: Validate manifests and referenced files
        run: npm run validate
      - name: Test boundaries and build
        run: npm test && npm run build
      - name: Protect previously published versions
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: node scripts/check-immutability.mjs "$BASE" "$HEAD"
